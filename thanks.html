<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thank you · Broke to B.L.I.N.G.</title>
<meta name="theme-color" content="#070605">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{--void:#070605;--line:rgba(217,188,134,.26);--gold:#D9BC86;--gold2:#F3DFAE;--gold3:#B98A45;--ivory:#F7F1E6;--mist:#B9AFA0;--display:"Playfair Display",Georgia,serif;--ui:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 50% 0%,rgba(217,188,134,.1),transparent 60%),var(--void);color:var(--ivory);font:15.5px/1.65 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 48px;text-align:center;display:grid;gap:18px;justify-items:center}
.logo{height:52px;width:auto}
.gem{width:84px;filter:drop-shadow(0 0 22px rgba(243,223,174,.5));animation:pop .8s cubic-bezier(.2,.8,.2,1.2) both;margin-top:18px}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,7vw,40px);line-height:1.15;margin:0}
p{margin:0;color:#E8E0D2}
.verse{font-family:var(--display);font-style:italic;color:var(--gold2);font-size:17px}
.btn{display:block;width:100%;max-width:360px;border-radius:8px;padding:15px 18px;font:600 15px var(--ui);text-decoration:none;color:#140F08;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));box-shadow:0 10px 30px rgba(217,188,134,.2)}
.small{font-size:12.5px;color:var(--mist)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <a href="/"><img class="logo" src="logo.png" alt="Broke to B.L.I.N.G. Declarations"></a>
  <img class="gem" src="diamond.png" alt="">
  <span class="eyebrow" id="eyebrow">Payment received</span>
  <h1 id="title">Thank you</h1>
  <p id="text">Your gift means more than you know. A receipt is on its way to your inbox.</p>
  <p class="verse">“God loveth a cheerful giver.” 2 Corinthians 9:7</p>
  <a class="btn" href="/" id="open">Open the declarations</a>
  <p class="small" id="small">Tip: add the app to your home screen so it is always one tap away.</p>
</main>
<script>
(function(){
  var id=(location.search.match(/session_id=([^&]+)/)||[])[1];
  try{ localStorage.setItem("bling-access",JSON.stringify({at:Date.now(),paid:true})); }catch(e){}
  if(!id){ return; }
  fetch("/.netlify/functions/verify-session?session_id="+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.paid){ document.getElementById("eyebrow").textContent="Almost there"; document.getElementById("text").textContent="We could not confirm your payment yet. If you were charged, your receipt from Stripe is your confirmation, and your access is ready below."; return; }
    var amt=j.amount?("$"+(j.amount/100).toFixed(2).replace(/\.00$/,"")):"";
    if(j.kind==="gift"){ document.getElementById("title").textContent="Thank you for sowing"+(amt?" "+amt:""); document.getElementById("text").textContent="Your gift helps keep these resources free for women who are rebuilding with God. A receipt is on its way to "+(j.email||"your inbox")+"."; }
    else { document.getElementById("title").textContent="You’re in. Thank you!"; document.getElementById("text").textContent="Your declarations are ready, and your "+(amt||"")+" contribution supports this work. A receipt is on its way to "+(j.email||"your inbox")+"."; }
  }).catch(function(){});
})();
</script>
</body>
</html>
